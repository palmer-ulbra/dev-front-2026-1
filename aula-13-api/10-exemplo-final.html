<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo final - Galeria Rick and Morty</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #1e1e2f;
        color: #fff;
        padding: 24px;
      }

      h1 {
        text-align: center;
      }

      #root {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }

      .card {
        background: #2a2a40;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        border: 2px solid transparent;
      }

      .card.alive {
        border-color: #44d62c;
      }

      .card.dead {
        border-color: #d62c2c;
      }

      .card img {
        width: 100%;
        border-radius: 8px;
      }

      .status {
        font-weight: bold;
      }

      .acoes {
        text-align: center;
        margin-bottom: 24px;
      }

      #btnCarregar {
        background: #44d62c;
        color: #111;
        font-weight: bold;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Galeria Rick and Morty - Desafio</h1>

    <div class="acoes">
      <button id="btnCarregar">Carregar personagens 🔘</button>
    </div>

    <div id="root">Clique em "Carregar personagens" para começar 🚀</div>

    <script>
      const root = document.querySelector("#root");
      const btn = document.querySelector("#btnCarregar");

      const carregar = async () => {
        root.innerHTML = "Carregando personagens... ⏳";

        try {
          const response = await fetch(
            "https://rickandmortyapi.com/api/character",
          );
          const data = await response.json();

          let html = "";

          data.results.forEach((character) => {
            const classe =
              character.status === "Alive"
                ? "alive"
                : character.status === "Dead"
                  ? "dead"
                  : "";

            html += `
              <div class="card ${classe}">
                <img src="${character.image}" alt="${character.name}" />
                <h2>${character.name}</h2>
                <p class="status">${character.status}</p>
                <p>${character.species}</p>
                <p>Gênero: ${character.gender}</p>
                <p>Origem: ${character.origin.name}</p>
              </div>
            `;
          });

          root.innerHTML = html;
        } catch (error) {
          root.innerHTML = "Erro ao buscar personagens 😢";
        }
      };

      btn.addEventListener("click", carregar);
    </script>
  </body>
</html>
