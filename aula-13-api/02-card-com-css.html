<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card com CSS</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 24px;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        max-width: 240px;
      }

      .card img {
        width: 100%;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://rickandmortyapi.com/api/character/avatar/1.jpeg" />
      <h2>Rick Sanchez</h2>
      <p>Alive</p>
      <p>Human</p>
    </div>
  </body>
</html>
