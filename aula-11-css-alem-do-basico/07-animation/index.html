<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation com @keyframes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>CSS Animation</h1>
      <p>Animações que rodam sozinhas usando <code>@keyframes</code>.</p>

      <section class="boxes">
        <div class="box pulse">pulse</div>
        <div class="box spin">spin</div>
        <div class="box bounce">bounce</div>
        <div class="box shake">shake</div>
      </section>

      <section class="loader-area">
        <h2>Exemplo de loader</h2>
        <div class="loader"></div>
      </section>
    </main>
  </body>
</html>
