<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>League of Legends</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="cards">
      <div class="left-cards">
        <div class="card">
          <div class="card-image">
            <img src="./images/lol_mel.jpg" alt="" />
          </div>
          <div class="card-content">
            <p>reflexo da alma</p>
            <h3>Mel</h3>
          </div>
        </div>
        <div class="card">
          <div class="card-image">
            <img src="./images/lol_aurora.jpg" alt="" />
          </div>
          <div class="card-content">
            <p>bruxa entre mundos</p>
            <h3>Aurora</h3>
          </div>
        </div>
        <div class="card">
          <div class="card-image">
            <img src="./images/lol_victor.jpg" alt="" />
          </div>
          <div class="card-content">
            <p>o arauto do arcano</p>
            <h3>Victor</h3>
          </div>
        </div>
        <div class="card">
          <div class="card-image">
            <img src="./images/lol_teemo.jpg" alt="" />
          </div>
          <div class="card-content">
            <p>o explorador veloz</p>
            <h3>Teemo</h3>
          </div>
        </div>
      </div>
      <div class="big-card">
        <div class="card">
          <div class="card-image">
            <img src="./images/lol_ambessa.jpg" alt="" />
          </div>
          <div class="card-content">
            <p>a matriarca da guerra</p>
            <h3>Ambessa</h3>
          </div>
        </div>
      </div>
    </div>

</html>
