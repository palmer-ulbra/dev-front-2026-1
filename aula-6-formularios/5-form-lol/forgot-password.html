<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riot Games</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="bg bg--forgot-password"></div>
      <header class="header">
        <img src="./media/riot.svg" alt="Logo da Riot" width="100" />
      </header>
      <main class="main">
        <form class="login" method="post">
          <h2 class="login-title">Forgot Password</h2>
          <p>Enter your username. The one that you use to sign in with.</p>
          <div class="login-item">
            <label for="user">User</label>
            <input
              type="text"
              name="user"
              id="user"
              required
              placeholder="rex"
              class="input"
            />
          </div>
          <div class="login-item">
            <select name="region" class="select">
              <option value="BR1">Brazil</option>
              <option value="EUN1">EU Nordic East</option>
              <option value="EUW1">EU West</option>
            </select>
          </div>
          <div class="login-item">
            <button type="submit" class="button">Submit</button>
          </div>
          <p class="links">
            <a href="./index.html">Already have an Account</a>
          </p>
        </form>
      </main>
      <footer class="footer">
        © 2026 Riot Games, Inc. Todos os direitos reservados.
      </footer>
    </div>
  </body>
</html>
