<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>setTimeout</title>
  </head>
  <body>
    <script>
      console.log("Início");

      setTimeout(() => {
        console.log("Executou depois de 2 segundos");
      }, 2000);

      console.log("Fim");
    </script>
  </body>
</html>
