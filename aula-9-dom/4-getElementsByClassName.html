<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha página</title>
  </head>
  <body>
    <p class="item">Item 1</p>
    <p class="item">Item 2</p>

        el.style.color = "red";
      }
    </script>
