<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha página</title>
  </head>
  <body>
    <input type="text" placeholder="Digite algo..." id="meuInput" />
    <p><strong>Evento:</strong> <span id="eventoTipo">-</span></p>
    <p><strong>Tecla:</strong> <span id="teclaPressionada">-</span></p>

    <script>
      const input = document.getElementById("meuInput");
      const eventoTipo = document.getElementById("eventoTipo");
      const teclaPressionada = document.getElementById("teclaPressionada");

      input.addEventListener("keydown", (event) => {
        eventoTipo.textContent = "keydown";
        teclaPressionada.textContent = event.key;
        console.log("Tecla pressionada:", event.key);
      });

      input.addEventListener("keyup", (event) => {
        eventoTipo.textContent = "keyup";
        teclaPressionada.textContent = event.key;
        console.log("Tecla liberada:", event.key);
      });
    </script>
  </body>
</html>
